plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'ru.bloodgoldensword'

base {
    archivesName = 'bloodgoldensword-1.20.1-forge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // официальный MCP_CONFIG mappings channel для 1.20.1
    mappings channel: 'official', version: '1.20.1'

    // не запускаем клиент/дебу — нужен только сборочный jar
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "bloodgoldensword",
                "Specification-Version"   : "1.0",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Переименовываем reobf-классы в notch-имена (обязательно для загрузки мода в игре)
reobf {
    jar {}
}

tasks.named('build') {
    dependsOn 'reobfJar'
}
